<!DOCTYPE html>
<!--
  L5 — API-Powered Live Search  (STARTER)
  =========================================
  Your goal: fetch users from JSONPlaceholder and build a live search UI.

  Features to implement:
    1. Fetch all users from https://jsonplaceholder.typicode.com/users on load
    2. Display users as cards (name, email, city)
    3. Search input that filters users by name or email as the user types
    4. Result count: "Showing 3 of 10 users"
    5. Loading state while fetching
    6. Error handling with a friendly message

  Key concepts:
    • async/await     — write async code that reads like sync code
    • response.ok     — check status before parsing JSON (true for 2xx codes)
    • response.json() — parse the response body as JSON (returns a Promise)
    • try/catch/finally — handle errors and always run cleanup code
    • "input" event   — fires on every keystroke in an <input>
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live User Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f2f5;
      padding: 2rem 1rem;
    }

    /* TODO: Style the search input, result count, status message, and user cards */

    .search-bar {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    .user-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .user-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.25rem;
      width: 260px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h1 style="text-align:center; margin-bottom: 1rem;">User Directory</h1>

  <input
    type="search"
    class="search-bar"
    id="search-input"
    placeholder="Search by name or email…"
  />

  <p id="result-count" style="text-align:center; margin-bottom:1rem;"></p>
  <div id="status" style="text-align:center;">Loading users…</div>
  <div class="user-grid" id="user-grid"></div>

  <script>
    // ── Step 1: Declare a variable to hold all users ────────────────────
    // Use let because it will be assigned after the fetch resolves.
    let allUsers = [];

    // ── Step 2: Get DOM references ──────────────────────────────────────
    const searchInput = document.querySelector('#search-input');
    const resultCount = document.querySelector('#result-count');
    const statusDiv   = document.querySelector('#status');
    const userGrid    = document.querySelector('#user-grid');

    // ── Step 3: fetchUsers() ────────────────────────────────────────────
    // Declare this function as `async` so you can use `await` inside it.
    async function fetchUsers() {
      try {
        // TODO: Use `await fetch(url)` to request users from:
        //       https://jsonplaceholder.typicode.com/users
        //       Store the result in a variable called `response`
        const response = await fetch(`https://jsonplaceholder.typicode.com/users`);
        // TODO: Check response.ok — if false, throw an Error with the status code
        //       Hint: throw new Error(`Server returned ${response.status}`)
        if (!response.ok){
            throw new Error(`Server returned ${response.status}`);
        }

        // TODO: Use `await response.json()` to parse the body
        //       Assign the result to allUsers
        allUsers = await response.json()

        // TODO: Hide the status div (statusDiv.style.display = "none")
        statusDiv.style.display = "none";
        // TODO: Call renderUsers(allUsers) to display all users
        renderUsers(allUsers);

      } catch (err) {
        // TODO: Show a friendly error message in statusDiv
        //       Use err.message to include the error details
        statusDiv.style.display = "block";
        statusDiv.textContent = `Failed to load: ${err.message}`;
      } finally {
        // TODO: This block always runs — log a message to the console
        //       (In a real app, you'd hide a loading spinner here)
        console.log(`User Load Complete`);
      }
    }

    // ── Step 4: renderUsers(users) ──────────────────────────────────────
    // Updates the DOM to show the given array of users.
    function renderUsers(users) {
      // TODO: Update resultCount.textContent to "Showing X of Y users"
        resultCount.textContent=`Showing ${users.length} of ${allUsers.length} users`;

      // TODO: Clear the grid: userGrid.innerHTML = ""
        userGrid.innerHTML = ""

      // TODO: If users.length is 0, show a "No results" message and return
      if (users.length == 0){
        userGrid.innerHTML="No Results";
        return;
      };

      // TODO: For each user, create a <div class="user-card"> element
      //       Set its innerHTML to show: name, email, and address.city
      //       Append each card to userGrid

      // User object shape (from JSONPlaceholder):
      // {
      //   id, name, email,
      //   address: { city, ... },
      //   ...
      // }
      users.forEach(user => {
      const card = document.createElement("div");
      card.className = "user-card";

     card.innerHTML = `
    <h3>${user.name}</h3>
    <p>${user.email}</p>
    <p>${user.address.city}</p>
`;

    userGrid.appendChild(card);

    // TODO: Set card.innerHTML with the user's name, email, and city

    // TODO: Append card to userGrid
});
      }
    

    // ── Step 5: Live filtering ──────────────────────────────────────────
    // The "input" event fires after every character typed or deleted.
    searchInput.addEventListener("input", function () {
      // TODO: Get the search query from searchInput.value
      //       Convert to lowercase and trim whitespace
        const query = searchInput.value.toLowerCase().trim();

      // TODO: If query is empty, show all users and return
        if (query === "") {
        renderUsers(allUsers);
        return;
        }
      // TODO: Filter allUsers — keep only users where:
      //         user.name.toLowerCase().includes(query)  OR
      //         user.email.toLowerCase().includes(query)
        const filteredUsers = allUsers.filter(user =>
    user.name.toLowerCase().includes(query) ||
    user.email.toLowerCase().includes(query)
    );
      // TODO: Call renderUsers() with the filtered array
      renderUsers(filteredUsers);
    });

    // ── Step 6: Kick off the fetch ──────────────────────────────────────
    fetchUsers();
  </script>

</body>
</html>
